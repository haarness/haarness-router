[server]
bind = "127.0.0.1:8080"
max_request_bytes = 33554432
max_concurrent_requests = 20000
first_byte_timeout_ms = 120000
drain_seconds = 30

[auth]
# Self-hosted connections need no key by default. Use --require-key to enable one.
enabled = false
allow_upstream_key_header = true

[web_ui]
enabled = true
path = "/ui"
basic_auth_username_env = "HAARNESS_UI_USERNAME"
basic_auth_password_env = "HAARNESS_UI_PASSWORD"
allow_runtime_key_management = true
max_runtime_keys = 64

# Provider credentials are injected by scripts/run-stackforward directly from
# the existing Stackforward YAML. They are never copied into this file.
[providers.openai]
kind = "openai"
api_key_env = "OPENAI_API_KEY"
allow_unknown_fields = true
connect_timeout_ms = 5000
stream_idle_timeout_ms = 120000
max_error_body_bytes = 4096

[providers.anthropic]
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
connect_timeout_ms = 5000
stream_idle_timeout_ms = 120000
max_error_body_bytes = 4096

[providers.gemini]
kind = "gemini"
api_key_env = "GEMINI_API_KEY"
connect_timeout_ms = 5000
stream_idle_timeout_ms = 120000
max_error_body_bytes = 4096

# Current chat models remain available offline; GET /v1/models also discovers
# newly released account-visible models automatically (five-minute cache).
[models."openai/gpt-6-astra"]
[models."openai/gpt-5.6-sol"]
[models."openai/gpt-5.6-terra"]
[models."openai/gpt-5.6-luna"]
[models."anthropic/claude-fable-5-1"]
[models."anthropic/claude-opus-5"]
[models."anthropic/claude-sonnet-5"]
[models."gemini/gemini-3.8-flash"]

[models."openai/gpt-5-nano"]

[models."anthropic/claude-haiku-4-5-20251001"]

[models."gemini/gemini-3.5-flash-lite"]

# General default: ordered fallback only occurs for safe pre-content failures
# such as connection errors, 408, 429, and 5xx responses.
[aliases.default]
targets = [
    "openai/gpt-5-nano",
    "gemini/gemini-3.5-flash-lite",
    "anthropic/claude-haiku-4-5-20251001",
]

[aliases.fast]
targets = [
    "openai/gpt-5-nano",
    "gemini/gemini-3.5-flash-lite",
]

[aliases.reasoning]
targets = [
    "openai/gpt-5-nano",
    "gemini/gemini-3.5-flash-lite",
    "anthropic/claude-haiku-4-5-20251001",
]

[aliases.vision]
targets = [
    "openai/gpt-5-nano",
    "gemini/gemini-3.5-flash-lite",
    "anthropic/claude-haiku-4-5-20251001",
]
