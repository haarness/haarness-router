[package]
name = "haarness-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
futures.workspace = true
png.workspace = true
reqwest.workspace = true
router-core = { version = "0.1.13", path = "../router-core" }
router-providers = { version = "0.1.13", path = "../router-providers" }
router-protocol = { version = "0.1.13", path = "../router-protocol" }
router-server = { version = "0.1.13", path = "../router-server" }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Checked before providers' HTTPS clients are built (the same release reqwest's verifier uses).
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
rustls-native-certs = "0.8"

# Colours in a Windows console need its virtual-terminal mode switched on.
[target.'cfg(windows)'.dependencies]
nu-ansi-term = "0.50"

[lints]
workspace = true
