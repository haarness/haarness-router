[server]
bind = "127.0.0.1:8080"
max_request_bytes = 33554432
max_concurrent_requests = 20000
first_byte_timeout_ms = 120000
drain_seconds = 30

[auth]
# Use --require-key to require HAARNESS_ROUTER_KEY instead.
enabled = false
allow_upstream_key_header = true

[web_ui]
enabled = true
path = "/ui"
# Set both fields to environment-variable names to protect the UI with Basic auth.
# basic_auth_username_env = "HAARNESS_UI_USERNAME"
# basic_auth_password_env = "HAARNESS_UI_PASSWORD"
allow_runtime_key_management = true
max_runtime_keys = 64

[providers.openai]
kind = "openai"
api_key_env = "OPENAI_API_KEY"
allow_unknown_fields = true

[providers.anthropic]
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

[providers.gemini]
kind = "gemini"
api_key_env = "GEMINI_API_KEY"

[providers.groq]
kind = "groq"
api_key_env = "GROQ_API_KEY"

[providers.mistral]
kind = "mistral"
api_key_env = "MISTRAL_API_KEY"

[providers.xai]
kind = "xai"
api_key_env = "XAI_API_KEY"

[providers.deepseek]
kind = "deepseek"
api_key_env = "DEEPSEEK_API_KEY"

[providers.together]
kind = "together"
api_key_env = "TOGETHER_API_KEY"

[providers.fireworks]
kind = "fireworks"
api_key_env = "FIREWORKS_API_KEY"

# Custom endpoints must provide base_url. Insecure HTTP is rejected unless
# allow_insecure_http is explicitly enabled for local testing.
[providers.local]
kind = "openai-compatible"
base_url = "http://127.0.0.1:9090"
api_key_env = "LOCAL_PROVIDER_KEY"
# Defaults to `Authorization: Bearer <key>`. For a raw custom header use:
# auth_header = "x-api-key"
# To add a prefix as well, set for example: auth_scheme = "Bearer"
allow_insecure_http = true
allow_unknown_fields = true
capabilities = { text = true, streaming = true, images = true, pdf_text_extraction = true, function_tools = true, parallel_tools = true, structured_outputs = true, reasoning = true }

# Current chat models remain available offline; GET /v1/models also discovers
# newly released account-visible models automatically (five-minute cache).
[models."openai/gpt-6-astra"]
[models."openai/gpt-5.6-sol"]
[models."openai/gpt-5.6-terra"]
[models."openai/gpt-5.6-luna"]
[models."anthropic/claude-fable-5-1"]
[models."anthropic/claude-opus-5"]
[models."anthropic/claude-sonnet-5"]
[models."gemini/gemini-4-argon"]
[models."gemini/gemini-3.8-flash"]

[models."openai/gpt-5-nano"]
[models."anthropic/claude-haiku-4-5-20251001"]
[models."gemini/gemini-3.5-flash-lite"]
[models."xai/grok-4.6"]
[models."deepseek/deepseek-v4-pro"]
[models."local/test"]

[aliases.fast]
targets = ["openai/gpt-5-nano", "gemini/gemini-3.5-flash-lite"]
